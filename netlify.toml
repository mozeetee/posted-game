# Bride-survey links (?role=bride) get their own HTML so link previews show a
# personal bridal card. It boots the same SPA. Must come before the catch-all.
[[redirects]]
  from = "/*"
  query = { role = "bride" }
  to = "/bride.html"
  status = 200
  force = true

# Bride Edition HOST links carry ?ed=bride so their preview is a bridal
# "you're the host" card instead of the generic game one.
[[redirects]]
  from = "/*"
  query = { role = "host", ed = "bride" }
  to = "/bride-host.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
